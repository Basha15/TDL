<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuestLog – Gamified Task Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-20 p-3 pt-[max(.75rem,env(safe-area-inset-top))]">
  <div class="glass glow-p max-w-2xl mx-auto p-3">
    <div class="flex items-center gap-3">
      <div id="lvl" class="w-12 h-12 rounded-xl grid place-items-center bg-gradient-to-br from-purple-500 to-sky-400 font-black text-xl">1</div>
      <div class="flex-1">
        <div class="flex justify-between text-xs text-slate-300"><span>LEVEL</span><span id="xpTxt"></span></div>
        <div class="h-3 rounded-full bg-white/10 overflow-hidden mt-1"><div id="xpFill" class="xpbar h-full" style="width:0"></div></div>
      </div>
    </div>
    <div class="flex justify-between mt-2 text-sm font-semibold">
      <span id="streak" class="text-orange-400"></span>
      <span class="text-amber-300">🪙 <b id="coins">0</b></span>
      <span class="text-sky-300">💎 <b id="gems">0</b></span>
    </div>
  </div>
</header>
<main id="view" class="max-w-2xl mx-auto p-3 pb-32"></main>
<nav class="fixed bottom-0 inset-x-0 z-20 glass rounded-none border-x-0 border-b-0 pb-[env(safe-area-inset-bottom)]">
  <div class="max-w-2xl mx-auto flex items-center justify-around py-2">
    <button data-tab="quests" class="px-6 py-2 text-sm font-semibold">⚔️ Quests</button>
    <button data-act="add" aria-label="Add quest" class="-mt-8 w-14 h-14 rounded-full bg-gradient-to-br from-purple-500 to-emerald-400 text-3xl font-bold glow-p">+</button>
    <button data-tab="shop" class="px-6 py-2 text-sm font-semibold">🛒 Shop</button>
  </div>
</nav>
<div id="overlay" class="hidden fixed inset-0 z-50 grid place-items-center bg-black/75 p-4 overflow-y-auto"></div>
<div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 glass px-4 py-2 text-sm opacity-0 transition-opacity pointer-events-none"></div>
<script type="module" src="js/app.js"></script>
</body></html>
